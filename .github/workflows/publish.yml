name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install ripgrep (the rg capability and door tests need the binary)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: npm pack --dry-run --json

      - name: Skip publish when the version is already on npm
        id: published-check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@catheadowl/ukp@${VERSION}" version --registry https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published-check.outputs.already-published != 'true'
        run: npm publish --access public
